<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Світ пончиків</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <header class="container fixed"> 
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Світ пончиків</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="cartBtn" class ="cartBtn" href="cart.html">Кошик</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Пошук" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Пошук</button>
                </form>
            </div>
        </div>
    </nav>
    </header>
    <main class="container cart-page">

        <section class="cart py-4">
            <h2>Ваш кошик</h2>
            <div class="cart-items-list">
                У кошику ще немає товарів
            </div>
            <div class="margin-y">
                Сума замовлення: <span class="cart-total">0</span> грн.
            </div>
            <button id="orderBtn" class="cart-btn margin-y">Оформити замовлення</button>
        </section>
        <section class="order">
            <h2>Оформлення замовлення</h2>
            <form class="order-form" action="" method="post">
                <div class="form-group mt-3">
                    <label for="firstName">Ім'я:</label>
                    <input class="form-control" type="text" id="firstName" name="firstName" required>
                </div>

                <div class="form-group mt-3">
                    <label for="lastName">Прізвище:</label>
                    <input class="form-control" type="text" id="lastName" name="lastName" required>
                </div>

                <div class="form-group mt-3">
                    <label for="email">Електронна пошта:</label>
                    <input class="form-control" type="email" id="email" name="email" required>
                </div>

                <div class="form-group mt-3">
                    <label for="phone">Номер телефону:</label>
                    <input class="form-control" type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group mt-3">
                    <label for="deliveryMethod">Спосіб доставки:</label>
                    <select class="form-select" id="deliveryMethod" name="deliveryMethod" required>
                        <option value="nova-poshta">Нова пошта</option>
                        <option value="ukrposhta">Укрпошта</option>
                        <option value="email">Електронна пошта</option>
                    </select>
                </div>

                <div id="postalDeliveryFields" class="delivery-fields" style="display: none;">
                    <div class="form-group mt-3">
                        <label for="city">Місто:</label>
                        <input class="form-control" type="text" id="city" name="city">
                    </div>
                    <div class="form-group mt-3">
                        <label for="postOfficeAddress">Адреса відділення:</label>
                        <input class="form-control" type="text" id="postOfficeAddress" name="postOfficeAddress">
                    </div>
                </div>

                <div id="emailDeliveryField" class="delivery-fields" style="display: none;">
                    <div class="form-group mt-3">
                        <label for="deliveryEmail">Електронна пошта для доставки:</label>
                        <input class="form-control" type="email" id="deliveryEmail" name="deliveryEmail">
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label for="comment">Коментар:</label>
                    <textarea class="form-control" id="comment" name="comment" rows="4"></textarea>
                </div>
                <button type="submit" class="cart-btn margin-y">Підтвердити</button>

            </form>
        </section>
    </main>
    <footer>
        <button id="themeToggle"><i class="bi bi-brightness-high"></i></button>
        <p>Ми компанія, яка спеціалізується на наданні якісних послуг.</p>
        <p>© 2025-2026 Company, Inc</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src='https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js'></script>
    <script src="script.js"></script>
    <script src="cart.js"></script>


</body>

</html>
